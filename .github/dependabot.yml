version: 2
updates:
  # Keep the GitHub Actions used by CI (actions/checkout, etc.) up to date.
  # All action bumps are batched into a single weekly PR, which then runs
  # through the cross-platform CI before it can merge.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # scripts/requirements.txt pins boto3 for the Device Farm runner
  # (scripts/devicefarm_run.py). The pin exists so the devicefarm workflow
  # installs a known version rather than whatever pip resolves that day; this
  # entry is what keeps that pin from going stale.
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      pip:
        patterns: ["*"]
