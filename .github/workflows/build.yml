name: build

# Build and package. Runs on every merge of staging into main: picks the next
# sequential release-N tag, builds every platform, and publishes the GitHub
# Release with all the archives (the signed .ipa and .aab included). It never
# distributes: nothing here talks to Google Play, App Store Connect, TestFlight
# or Fly. Distribution is the separate, manual release workflow (release.yml),
# which ships a chosen release-N from its GitHub Release assets.
#
# danheskett.com is the one exception, by decision: the site pulls each game's
# latest GitHub Release when it builds, so a release published here reaches the
# site at its next build.
#
# Any failure fails the run and nothing after it runs: `publish` needs every
# build to have succeeded (a plain `needs:`), so a failed, cancelled or skipped
# build means no tag and no GitHub Release. Missing signing material is a
# failure, never a quiet skip -- a release without a signed .ipa or .aab cannot
# be distributed, so it is not a release.
#
# The tag is created in `publish` AFTER all builds succeed, so a failed build
# leaves N unused and the next run reuses it. The triggering commit SHA is
# captured in `prepare` and used everywhere, so a later push to main does not
# change what gets tagged. A GITHUB_TOKEN tag push starts no workflow, so this
# never retriggers itself.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.editorconfig'
      - 'LICENSE'
      - 'NOTICE'
      # Store artwork, screenshots and listing text are not compiled into any
      # build, so changing them should not burn a release number. The release
      # workflow pushes the listing from the repo when it ships.
      - 'android/play-assets/**'
      - 'ios/app-store-assets/**'
  # A manual run is a test, so it defaults to a dry run; a push to main is a build.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify everything; tag nothing, publish nothing'
        type: boolean
        default: true

# A dry run is labelled as one everywhere it appears, so it can never be read
# as a published build.
run-name: ${{ inputs.dry_run && 'DRY RUN - build (nothing tagged or published)' || format('build {0}', github.sha) }}

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

# bash -eo pipefail for every step: a failing command, including one inside a
# pipe, fails its step.
defaults:
  run:
    shell: bash

jobs:
  guard:
    uses: ./.github/workflows/attribution-guard.yml
    permissions:
      contents: write

  prepare:
    needs: guard
    name: compute next release number
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: |
          # Find max N across existing release-N tags; default to 0.
          last=$(git tag --list 'release-*' \
                   | sed -n 's/^release-\([1-9][0-9]*\)$/\1/p' \
                   | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA"  >> "$GITHUB_OUTPUT"
          echo "Next release: release-$next at $GITHUB_SHA"

  build-linux-windows:
    name: linux + windows builds
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Cache the apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-build-linux-windows-ubuntu22-${{ hashFiles('scripts/apt_install.sh') }}-${{ github.run_id }}
          restore-keys: apt-build-linux-windows-ubuntu22-
      - name: Install Linux + mingw deps
        env:
          APT_ARCHIVES: /home/runner/apt-archives
          DEBIAN_FRONTEND: noninteractive
        run: |
          ./scripts/apt_install.sh \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64 \
            zip
      - name: Build raylib (Linux)
        run: ./scripts/build_raylib_linux.sh
      - name: Run tests
        run: make test RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Build raylib (mingw win64 + win32)
        run: ./scripts/build_raylib_windows.sh
      - name: Package Linux + Windows archives
        run: make dist-linux dist-windows RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-windows
          path: |
            dist/*.tar.gz
            dist/*.zip

  build-mac:
    name: macOS universal build
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build raylib (universal arm64 + x86_64)
        run: ./scripts/build_raylib_mac.sh
      - name: Package macOS archive
        run: make dist-mac RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*.zip

  build-web:
    name: web (WASM) build
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
      # See game-ci.yml: the web target can transitively need the native Linux build.
      - name: Cache the apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-build-web-ubuntu22-${{ hashFiles('scripts/apt_install.sh') }}-${{ github.run_id }}
          restore-keys: apt-build-web-ubuntu22-
      - name: Install Linux build deps + zip
        env:
          APT_ARCHIVES: /home/runner/apt-archives
        run: |
          ./scripts/apt_install.sh \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev \
            zip
      - name: Build raylib (Linux)
        run: ./scripts/build_raylib_linux.sh
      - name: Build raylib (web)
        run: ./scripts/build_raylib_web.sh
      # RELEASE_VERSION must be passed HERE, not only to dist-web: it can bake a version
      # header into the wasm. Packaging later with a different value would rezip a binary
      # carrying the wrong version.
      - name: Build WASM
        run: make web RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - name: Package WASM bundle
        run: make dist-web RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/*.zip

  build-ios:
    name: iOS device .ipa build
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Apple rejects uploads built against an older SDK ("This app was built
      # with the iOS 17.5 SDK. All iOS and iPadOS apps must be built with the
      # iOS 26 SDK or later"). Fail here, with a clear message, rather than
      # after a full build at Apple's validator.
      - name: Check the iOS SDK is new enough for the App Store
        run: |
          set -eux
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK: $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::iOS SDK $sdk is too old; the App Store requires 26+. Update the runner image or select a newer Xcode."
            exit 1
          fi
      # A release needs an App Store-signed .ipa, so every signing secret is
      # required; a missing one fails the build rather than producing an
      # unsigned .ipa that could never be distributed.
      - name: Require the iOS signing secrets
        env:
          C: ${{ secrets.IOS_CERT_P12 }}
          P: ${{ secrets.IOS_CERT_PASSWORD }}
          M: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          T: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=""
          [ -n "$C" ] || missing="$missing IOS_CERT_P12"
          [ -n "$P" ] || missing="$missing IOS_CERT_PASSWORD"
          [ -n "$M" ] || missing="$missing IOS_PROVISIONING_PROFILE"
          [ -n "$T" ] || missing="$missing IOS_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing iOS signing secret(s):$missing"
            exit 1
          fi
      # App Store-submittable .ipa: distribution cert in a throwaway keychain,
      # App Store provisioning profile embedded, entitlements generated by the
      # Makefile. The keychain dies with the runner.
      - name: Package iOS .ipa (App Store signed)
        env:
          IOS_CERT_P12:             ${{ secrets.IOS_CERT_P12 }}
          IOS_CERT_PASSWORD:        ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_TEAM_ID:              ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/openklondike-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "$IOS_CERT_P12"             | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_PROVISIONING_PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -f pkcs12
          # Without this, codesign blocks on an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Apple Distribution/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "no Apple Distribution identity found in the keychain" >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          fi
          echo "signing as: $IDENTITY"

          make dist-ios \
            RELEASE_VERSION=${{ needs.prepare.outputs.version }} \
            IOS_SIGN_IDENTITY="$IDENTITY" \
            IOS_PROFILE="$RUNNER_TEMP/profile.mobileprovision" \
            IOS_TEAM_ID="$IOS_TEAM_ID"
      - name: Verify the .ipa is signed and App Store-shaped
        run: |
          set -euo pipefail
          app="build/ios-device/Payload/Openklondike.app"
          codesign --verify --strict --verbose=2 "$app"
          echo "--- entitlements ---"
          codesign -d --entitlements :- "$app"
          test -f "$app/embedded.mobileprovision" || { echo "no embedded profile" >&2; exit 1; }
          test -f "$app/Assets.car"               || { echo "no compiled app icon" >&2; exit 1; }
          # Top-level CFBundleIconName, not just the nested one actool writes:
          # missing it fails the upload with ITMS-90713.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion'  "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*.ipa

  build-android:
    name: android APK (sideload) + AAB (Play) build
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      # targetSdkVersion in android/AndroidManifest.xml is the single source for
      # the SDK this builds against. Both values were hardcoded here and drifted:
      # two workflows in the same repo disagreed, and this value, not the
      # Makefile's, is what reaches aapt.
      - name: Read the SDK version from the manifest
        run: |
          T=$(sed -n 's/.*targetSdkVersion="\([0-9]*\)".*/\1/p' android/AndroidManifest.xml)
          [ -n "$T" ] || { echo "no targetSdkVersion in android/AndroidManifest.xml"; exit 1; }
          echo "ANDROID_PLATFORM_VER=$T"    >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$T.0.0" >> "$GITHUB_ENV"
      - name: Install NDK + build-tools + platform
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platforms;android-${ANDROID_PLATFORM_VER}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build raylib (Android, arm64-v8a)
        run: ./scripts/build_raylib_android.sh
      - name: Package sideload APK (debug-signed)
        run: |
          make dist-android \
            ANDROID_BUILD_TOOLS="${ANDROID_BUILD_TOOLS}" \
            ANDROID_PLATFORM_VER="${ANDROID_PLATFORM_VER}" \
            RELEASE_VERSION=${{ needs.prepare.outputs.version }}
      # A release needs the upload-signed AAB, so every Play signing secret is
      # required; a missing one fails the build rather than quietly shipping
      # only the sideload APK.
      - name: Require the Play signing secrets
        env:
          K:  ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          SP: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$K" ]  || missing="$missing PLAY_UPLOAD_KEYSTORE"
          [ -n "$SP" ] || missing="$missing PLAY_KEYSTORE_PASSWORD"
          [ -n "$KP" ] || missing="$missing PLAY_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::missing Play signing secret(s):$missing"
            exit 1
          fi
      - name: Package Play bundle (AAB, upload-signed)
        env:
          PLAY_UPLOAD_KEYSTORE:    ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_KEYSTORE_PASSWORD:  ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_PASSWORD:       ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          echo "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          make dist-android-play \
            ANDROID_BUILD_TOOLS="${ANDROID_BUILD_TOOLS}" \
            ANDROID_PLATFORM_VER="${ANDROID_PLATFORM_VER}" \
            RELEASE_VERSION=${{ needs.prepare.outputs.version }} \
            PLAY_KEYSTORE="$RUNNER_TEMP/upload.jks" \
            PLAY_STORE_PASS="$PLAY_KEYSTORE_PASSWORD" \
            PLAY_KEY_PASS="$PLAY_KEY_PASSWORD"
      # Both files must exist: the release workflow ships the AAB to Play.
      - name: Check both Android artifacts exist
        run: |
          ls dist/*.apk dist/*.aab
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            dist/*.apk
            dist/*.aab

  publish:
    name: tag + publish GitHub Release
    # A plain `needs:`: this runs only if every build succeeded.
    needs: [prepare, build-linux-windows, build-mac, build-web, build-ios, build-android]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-merged
          merge-multiple: true
      - run: ls -la dist-merged/
      # Every platform's archive must be here before anything is tagged.
      - name: Check every artifact is present
        run: |
          for pat in '*-android-arm64.apk' '*-android.aab' '*-ios-arm64.ipa' \
                     '*-linux-x86_64.tar.gz' '*-macos-universal.zip' '*-web-wasm.zip' \
                     '*-windows-x64.zip' '*-windows-x86.zip'; do
            compgen -G "dist-merged/$pat" >/dev/null || { echo "::error::no artifact matching $pat"; exit 1; }
          done
      # The two publishing steps, and only these, are what `dry_run` withholds. Everything
      # before them still runs, so a dry run proves the build and the packaging without
      # consuming a release number or putting anything in front of a user.
      - name: Create release-N tag at the captured commit
        if: ${{ !inputs.dry_run }}
        env:
          V: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "release-$V" "$SHA"
          git push origin "release-$V"
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ needs.prepare.outputs.version }}
          name: release-${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: dist-merged/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
