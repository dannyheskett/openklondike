name: ci

# Runs on every pull request targeting main. Each job rebuilds raylib from source for its
# platform (the install dirs are gitignored), then builds openklondike:
#   - linux:   native gcc, unit tests, dev (-O2) + release (-O3)
#   - windows: mingw-w64 cross-compile, x64 + x86
#   - mac:     clang universal binary, arm64 + x86_64
#
# Branch protection requires every job here to pass before a PR can merge, and every merge
# to main cuts a release, so this is the gate that keeps main releasable.
#
# There is deliberately NO paths-ignore. A workflow that never triggers never reports a
# status, and a required check that never reports blocks the PR forever -- a docs-only PR
# would hang instead of merging. Running the full matrix on a README change wastes a few
# runner minutes; the deadlock wastes an afternoon. release.yml still skips docs-only
# pushes, so they cut no release.
#
# For the same reason, do NOT put [skip ci] in a commit destined for a PR: GitHub skips the
# whole run, the required checks never report, and the PR cannot be merged.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job ids are the branch-protection check names -- these jobs carry no `name:` precisely so
# the check name stays short and stable. Renaming a job silently breaks protection, because
# a required check that no longer reports blocks every PR.
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install raylib build + runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev
      - name: Build raylib (Linux, static)
        run: ./scripts/build_raylib_linux.sh
      - name: Run unit tests
        run: make test
      - name: Build dev + release
        run: make all release

  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install mingw cross-toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # C99 cross-compile only: the two mingw C compilers + binutils directly. The
          # `mingw-w64` metapackage pulls the whole g++ toolchain (both arches x
          # posix/win32) + perl -- 39 packages / 241 MB, none of which this build uses.
          # binutils-mingw-w64 supplies the *-ar that build_raylib_windows.sh invokes.
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64
      - name: Build raylib (mingw win64 + win32)
        run: ./scripts/build_raylib_windows.sh
      - name: Cross-compile Win64 + Win32
        run: make windows

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Build raylib (universal arm64 + x86_64)
        run: ./scripts/build_raylib_mac.sh
      - name: Build universal binary
        run: make mac
